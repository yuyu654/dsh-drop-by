# presence-gate 生成用的最小 overlay。
#
# 为什么需要它：不带 --patch 时 dsh CLI 走默认的 deepseek-official 路由，要求
# DEEPSEEK_API_KEY 环境变量，直接报 MISSING_CREDENTIAL。这份 overlay 把路由换成
# 桌面端已登录的 deepseek-account（凭据从 <DSH_HOME>/.credentials.yaml 读），
# 于是不用在这台机器上再存一份 key。
#
# 只留生成一句话必需的几项，不挂任何 MCP 工具：这一轮不需要刷抖音、不需要发消息。

- id: credentials
  disabled: false

- id: authorization
  disabled: false

- id: deepseek-account
  disabled: false

- id: working-directory
  config:
    defaultDirectory: 'C:/Users/YOU/.dsh/presence-gate'

- id: sandbox-policy
  config:
    mode: 'workspace-write'
    workspaceRoot: 'C:/Users/YOU/.dsh/presence-gate'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: 'deepseek-account'
    model: 'deepseek-flash'
    reasoningEffort: 'low'
